<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contacto | Atacalma</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="assets/css/style.css">
    
    <script defer src="assets/js/script_contacto_validacion.js"></script> 
</head>
<body class="bg-light p-4">

    <div class="card p-4 shadow-sm border-0 rounded-4" style="max-width: 600px; margin: 0 auto;">
        <h3 class="text-center mb-4 inter">Formulario de Contacto</h3>
        
        <form id="contactForm" novalidate>
            <div class="mb-3">
                <label for="nombre" class="form-label fw-bold">Nombre Completo</label>
                <input type="text" class="form-control" id="nombre" placeholder="Tu nombre">
                <div class="invalid-feedback" id="error-nombre"></div>
            </div>

            <div class="mb-3">
                <label for="email" class="form-label fw-bold">Correo Electrónico</label>
                <input type="email" class="form-control" id="email" placeholder="nombre@correo.com">
                <div class="invalid-feedback" id="error-email"></div>
            </div>

            <div class="mb-3">
                <label for="mensaje" class="form-label fw-bold">Mensaje o Consulta</label>
                <textarea class="form-control" id="mensaje" rows="4" placeholder="Escribe tu consulta aquí..."></textarea>
                <div class="invalid-feedback" id="error-mensaje"></div>
            </div>

            <button type="submit" class="btn btn-primary w-100 fw-bold">Enviar Mensaje</button>
        </form>
    </div>

</body>
</html>
